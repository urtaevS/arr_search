services:
  torrent-search:
    build: .
    container_name: torrent-search
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      # Избранное хранится в ./data/favorites.json — bind-mount, чтобы данные
      # переживали пересоздание контейнера и были доступны для ручной правки.
      - ./data:/app/data
    restart: unless-stopped
